! R5 - last-hop router (LHR) for the multicast receiver; runs IGMP
! Paste into: vtysh -> configure terminal -> (paste) -> end -> write memory
!
hostname R5
!
ip pim rp 192.168.0.1 224.0.0.0/4
!
interface eth0
 description LINK TO R3
 ip address 10.0.0.18/30
 ip pim
!
interface eth1
 description LINK TO MULTICAST RECEIVER
 ip address 172.19.1.1/24
 ip pim
 ip igmp
 ip igmp version 2
!
! Optional: make R5 itself a group member so the tree builds even before
! the Receiver host joins. FRR 8.x syntax; on FRR 10.x use "ip igmp join-group".
! interface eth1
!  ip igmp join 239.1.1.10
!
router eigrp 100
 eigrp router-id 5.5.5.5
 network 10.0.0.16/30
 network 172.19.1.0/24
 passive-interface eth1
!
