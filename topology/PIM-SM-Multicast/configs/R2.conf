! R2 - Rendezvous Point (RP), 192.168.0.1 on the loopback
! Paste into: vtysh -> configure terminal -> (paste) -> end -> write memory
!
hostname R2
!
ip pim rp 192.168.0.1 224.0.0.0/4
!
interface lo
 description RENDEZVOUS POINT ADDRESS
 ip address 192.168.0.1/32
 ip pim
!
interface eth0
 description LINK TO R1
 ip address 10.0.0.2/30
 ip pim
!
interface eth1
 description LINK TO R4
 ip address 10.0.0.9/30
 ip pim
!
router eigrp 100
 eigrp router-id 2.2.2.2
 network 10.0.0.0/30
 network 10.0.0.8/30
 network 192.168.0.1/32
!
