! R4 - transit router between R2 (RP) and R3
! Paste into: vtysh -> configure terminal -> (paste) -> end -> write memory
!
hostname R4
!
ip pim rp 192.168.0.1 224.0.0.0/4
!
interface eth0
 description LINK TO R2 (RENDEZVOUS POINT)
 ip address 10.0.0.10/30
 ip pim
!
interface eth1
 description LINK TO R3
 ip address 10.0.0.13/30
 ip pim
!
! Optional: the diagram shows a 172.19.2.0/24 LAN on R4, but the original
! lab never configured it. Uncomment to add it as a second receiver LAN.
!interface eth2
! description OPTIONAL RECEIVER LAN
! ip address 172.19.2.1/24
! ip pim
! ip igmp
!
router eigrp 100
 eigrp router-id 4.4.4.4
 network 10.0.0.8/30
 network 10.0.0.12/30
! network 172.19.2.0/24
! passive-interface eth2
!
