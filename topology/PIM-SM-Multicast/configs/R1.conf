! R1 - first-hop router (FHR) for the multicast source
! Paste into: vtysh -> configure terminal -> (paste) -> end -> write memory
!
hostname R1
!
ip pim rp 192.168.0.1 224.0.0.0/4
!
interface eth0
 description LINK TO MULTICAST SOURCE (Server)
 ip address 172.19.0.1/24
 ip pim
!
interface eth2
 description LINK TO R2 (RENDEZVOUS POINT)
 ip address 10.0.0.1/30
 ip pim
!
interface eth3
 description LINK TO R3
 ip address 10.0.0.5/30
 ip pim
!
router eigrp 100
 eigrp router-id 1.1.1.1
 network 10.0.0.0/30
 network 10.0.0.4/30
 network 172.19.0.0/24
 passive-interface eth0
!
