! R3 - transit router between R1, R4 and R5
! Paste into: vtysh -> configure terminal -> (paste) -> end -> write memory
!
hostname R3
!
ip pim rp 192.168.0.1 224.0.0.0/4
!
interface eth0
 description LINK TO R1
 ip address 10.0.0.6/30
 ip pim
!
interface eth1
 description LINK TO R4
 ip address 10.0.0.14/30
 ip pim
!
interface eth2
 description LINK TO R5
 ip address 10.0.0.17/30
 ip pim
!
router eigrp 100
 eigrp router-id 3.3.3.3
 network 10.0.0.4/30
 network 10.0.0.12/30
 network 10.0.0.16/30
!
