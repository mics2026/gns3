! R3 - AS 65003, last-hop router for H3 (receiver)
! Paste into: vtysh -> configure terminal -> (paste) -> end -> write memory
!
hostname R3
!
ip pim rp 10.255.0.1 239.0.0.0/8
!
interface eth0
 description LINK TO R1 (AS 65001)
 ip address 10.0.13.2/30
 ip pim
!
interface eth1
 description LINK TO R2 (AS 65002)
 ip address 10.0.23.2/30
 ip pim
!
interface eth2
 description LAN SW3 - H3 receiver
 ip address 192.168.30.1/24
 ip pim
 ip igmp
!
router bgp 65003
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 timers bgp 3 9
 neighbor 10.0.13.1 remote-as 65001
 neighbor 10.0.23.1 remote-as 65002
 !
 address-family ipv4 unicast
  network 192.168.30.0/24
 exit-address-family
!
