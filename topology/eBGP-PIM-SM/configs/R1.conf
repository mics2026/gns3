! R1 - AS 65001, Rendezvous Point (lo 10.255.0.1), first-hop router for H1 (source)
! Paste into: vtysh -> configure terminal -> (paste) -> end -> write memory
!
hostname R1
!
ip pim rp 10.255.0.1 239.0.0.0/8
!
interface eth0
 description LINK TO R2 (AS 65002)
 ip address 10.0.12.1/30
 ip pim
!
interface eth1
 description LINK TO R3 (AS 65003)
 ip address 10.0.13.1/30
 ip pim
!
interface eth2
 description LAN SW1 - H1 multicast source
 ip address 192.168.10.1/24
 ip pim
!
interface lo
 description RENDEZVOUS POINT ADDRESS
 ip address 10.255.0.1/32
 ip pim
!
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 timers bgp 3 9
 neighbor 10.0.12.2 remote-as 65002
 neighbor 10.0.13.2 remote-as 65003
 !
 address-family ipv4 unicast
  network 192.168.10.0/24
  network 10.255.0.1/32
 exit-address-family
!
