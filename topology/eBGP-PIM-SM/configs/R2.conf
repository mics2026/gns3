! R2 - AS 65002, last-hop router for H2 (receiver)
! Paste into: vtysh -> configure terminal -> (paste) -> end -> write memory
!
hostname R2
!
ip pim rp 10.255.0.1 239.0.0.0/8
!
interface eth0
 description LINK TO R1 (AS 65001)
 ip address 10.0.12.2/30
 ip pim
!
interface eth1
 description LINK TO R3 (AS 65003)
 ip address 10.0.23.1/30
 ip pim
!
interface eth2
 description LAN SW2 - H2 receiver
 ip address 192.168.20.1/24
 ip pim
 ip igmp
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 timers bgp 3 9
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.23.2 remote-as 65003
 !
 address-family ipv4 unicast
  network 192.168.20.0/24
 exit-address-family
!
