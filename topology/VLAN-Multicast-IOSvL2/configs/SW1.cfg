! SW1 - Cisco IOSvL2 (vios_l2 15.2)
! Gi0/0 = e0 trunk to R1 eth0, Gi0/1 = e1 VLC Sender (VLAN 20), Gi0/2 = e2 IGMP Receiver (VLAN 10)
!
hostname SW1
no ip domain-lookup
!
vlan 10
 name RECEIVER
vlan 20
 name SOURCE
!
interface GigabitEthernet0/0
 description e0 - 802.1Q trunk to R1 eth0
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 1
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 switchport nonegotiate
 no shutdown
!
interface GigabitEthernet0/1
 description e1 - VLC Sender 192.168.20.10
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast edge
 no shutdown
!
interface GigabitEthernet0/2
 description e2 - IGMP Receiver 192.168.10.10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast edge
 no shutdown
!
! IGMP snooping is on by default; listed here so it is explicit.
ip igmp snooping
!
line con 0
 exec-timeout 0 0
 logging synchronous
!
end
