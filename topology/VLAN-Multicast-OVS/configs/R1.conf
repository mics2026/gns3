! R1 - FRR 8.2.2, router-on-a-stick, PIM-SM, RP, IGMP querier
! Paste into vtysh "configure terminal" after eth0.10 / eth0.20 exist (README step 3).
!
hostname R1
!
interface eth0.10
 description VLAN 10 - IGMP Receiver
 ip address 192.168.10.1/24
 ip pim
 ip igmp
 ip igmp version 3
 ip igmp query-interval 30
!
interface eth0.20
 description VLAN 20 - VLC Sender
 ip address 192.168.20.1/24
 ip pim
!
! Static RP for the ASM range. 232.0.0.0/8 stays SSM (FRR default) and needs no RP.
ip pim rp 192.168.20.1 239.0.0.0/8
!
